[project]
name = "noc"
version = "0.1.0"
description = "Pythonic port of The Nature of Code, visualized with arcade"
authors = [
    { name = "truizsanchez" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "arcade>=3.3.3",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PTH"]
ignore = [
    "PLR2004",  # magic numbers are everywhere in simulation tuning code
    "PLR0911",
    "PLR0912",
    "PLR0913",  # drawing helpers mirror p5 signatures; physics constructors take many parameters
    "PLR0917",  # ... positionally, as in the book (circle(x, y, d)), and so do arcade callbacks
]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses are safe as dataclass defaults.
extend-immutable-calls = ["noc.common.vector.Vector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["arcade.*", "pyglet.*"]
ignore_missing_imports = true
